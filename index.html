<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<title>Entreno</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- iOS ignora los iconos del manifest: necesita este enlace, y en PNG. -->
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Iconos. Inline para que no haya una peticion mas en un sotano sin cobertura. -->
<svg style="display:none" aria-hidden="true"><defs>
  <g id="i-hoy"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></g>
  <g id="i-entrenar"><path d="M6.5 7v10M17.5 7v10M3 9v6M21 9v6M6.5 12h11"/></g>
  <g id="i-comer"><path d="M6 3v8a2 2 0 0 0 4 0V3M8 11v10M18 3c-1.5 1.5-2 3.5-2 5.5V13h3V3z"/></g>
  <g id="i-analisis"><path d="M4 20V10M10 20V4M16 20v-7M22 20v-11"/></g>
  <g id="i-refresco"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></g>
  <g id="i-folio"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></g>
  <g id="i-cuerpo"><path d="M12 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM8 9h8l-1.5 5H16l1 7h-2l-1-5h-4l-1 5H7l1-7h1.5z"/></g>
  <g id="i-info"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></g>
  <g id="i-check"><path d="m5 13 4 4L19 7"/></g>
  <g id="i-mas"><path d="M12 5v14M5 12h14"/></g>
  <g id="i-menos"><path d="M5 12h14"/></g>
  <g id="i-x"><path d="M6 6l12 12M18 6 6 18"/></g>
  <g id="i-nube"><path d="M7 18a4 4 0 0 1 .5-8 5.5 5.5 0 0 1 10.6 1.4A3.5 3.5 0 0 1 17.5 18z"/></g>
</defs></svg>

<header id="cabecera">
  <div class="cab-txt">
    <div class="cab-fila">
      <h1 id="titulo">Entreno</h1>
      <button id="btn-actualizar" type="button" title="Actualizar app, pulsera y datos" aria-label="Actualizar"><svg class="ic"><use href="#i-refresco"/></svg></button>
    </div>
    <p id="subtitulo" class="sub"></p>
  </div>
  <button id="btn-semana" class="chip-sync" type="button" title="La semana: fase, qué se espera y dónde mejorar"><svg class="ic"><use href="#i-folio"/></svg></button>
  <button id="estado-sync" class="chip-sync" type="button" title="Estado de sincronización">
    <svg class="ic"><use href="#i-nube"/></svg><span id="pendientes"></span>
  </button>
</header>

<main id="vista" aria-live="polite"></main>

<nav id="tabs" role="tablist">
  <button role="tab" data-tab="hoy"><svg class="ic"><use href="#i-hoy"/></svg><span>Hoy</span></button>
  <button role="tab" data-tab="entrenar"><svg class="ic"><use href="#i-entrenar"/></svg><span>Entreno</span></button>
  <button role="tab" data-tab="comer"><svg class="ic"><use href="#i-comer"/></svg><span>Comida</span></button>
  <button role="tab" data-tab="cuerpo"><svg class="ic"><use href="#i-analisis"/></svg><span>Análisis</span></button>
</nav>

<!-- Barra de descanso: vive fuera de las vistas para sobrevivir al cambio de pestana -->
<div id="descanso" hidden>
  <div id="descanso-barra"></div>
  <div class="descanso-cuerpo">
    <span id="descanso-reloj">0:00</span>
    <span id="descanso-que" class="sub"></span>
    <button id="descanso-mas" type="button">+30s</button>
    <button id="descanso-fin" type="button">Saltar</button>
  </div>
</div>

<div id="hoja" hidden><div id="hoja-cuerpo"></div></div>

<!-- La version en la URL: un index.html nuevo trae SIEMPRE modulos nuevos, aunque
     el navegador tenga los anteriores en cache. La sube app/desplegar.js. -->
<script type="module" src="js/app.js?v=2026-09-23.16"></script>
</body>
</html>
